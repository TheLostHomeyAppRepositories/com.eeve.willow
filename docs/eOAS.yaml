        '500':
          $ref: '#/components/responses/default500'
  /api/navigation/hardEmergencyStop:
    put:
      tags:
        - Navigation
      description: Places the robot in hard emergency stop
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '500':
          $ref: '#/components/responses/default500'
  /navigation/releaseEmergencyStop:
    get:
      deprecated: true
      tags:
        - Navigation
      description: Releases all active emergency stops
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '500':
          $ref: '#/components/responses/default500'
  /api/navigation/releaseEmergencyStop:
    put:
      tags:
        - Navigation
      description: Releases all active emergency stops
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '500':
