      deprecated: true
      tags:
        - Navigation
      description: While in [manual driving mode](#/Navigation/put_api_navigation_startmanualdriving), makes the robot navigate forward
      parameters:
        - $ref: '#/components/parameters/speed'
        - $ref: '#/components/parameters/distance'
        - $ref: '#/components/parameters/turnRadius'
        - $ref: '#/components/parameters/rotation'
        - $ref: '#/components/parameters/powerLimit'
      responses:
        '200':
          $ref: '#/components/responses/default200'
  /api/navigation/forward:
    put:
      tags:
        - Navigation
      description: While in [manual driving mode](#/Navigation/put_api_navigation_startmanualdriving), makes the robot navigate forward
      parameters:
        - $ref: '#/components/parameters/speed'
        - $ref: '#/components/parameters/distance'
        - $ref: '#/components/parameters/turnRadius'
        - $ref: '#/components/parameters/rotation'
        - $ref: '#/components/parameters/powerLimit'
      responses:
        '200':
          $ref: '#/components/responses/default200'
  /navigation/hardEmergencyStop:
