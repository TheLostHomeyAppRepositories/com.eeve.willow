        - $ref: '#/components/parameters/wheelLock'
        - $ref: '#/components/parameters/powerLimit'
      responses:
        '200':
          $ref: '#/components/responses/default200'
  /api/navigation/spinAround:
    put:
      tags:
        - Navigation
      description: While in [manual driving mode](#/Navigation/put_api_navigation_startmanualdriving), makes the robot navigate in a circle
      parameters:
        - $ref: '#/components/parameters/speed'
        - $ref: '#/components/parameters/rotation'
        - $ref: '#/components/parameters/wheelLock'
        - $ref: '#/components/parameters/powerLimit'
