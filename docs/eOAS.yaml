  /api/livestreams/startVideo:
    post:
      tags:
        - WebRTC and livestreams
      summary: Start live or recording video stream
      description: |
        Starts sending video over an established WebRTC peer connection.
        The `peerUuid` must match the peer created via the `/webrtc` signaling WebSocket.
        Call this on the main `httpcalls` data channel (or via direct HTTP when on LAN).

        For `streamType: recording`, optionally pass `videoFile` with the path from
        `/api/annotations/listRecordings` to stream a specific MKV file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LivestreamStartRequest'
      responses:
        '200':
          description: Stream start accepted
          content:
            application/json:
              schema:
                type: string
                example: video_start_pending+{peerUuid}
        '400':
          description: Missing peerUuid, invalid streamType, or no video track
          content:
            application/json:
              schema:
                type: string
        '404':
          description: Peer not found
        '500':
          $ref: '#/components/responses/default500'
  /api/livestreams/stopVideo:
    post:
      tags:
        - WebRTC and livestreams
      summary: Stop live or recording video stream
      description: |
        Stops video streaming for the given WebRTC peer.
        Set `streamType` to `recording` when stopping a file-playback peer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LivestreamStopRequest'
      responses:
        '200':
          description: Stream stopped
          content:
            application/json:
              schema:
                type: string
                example: video_stopped+{peerUuid}
        '400':
          description: Missing or invalid request body
        '404':
          description: Peer not found
        '500':
          $ref: '#/components/responses/default500'
