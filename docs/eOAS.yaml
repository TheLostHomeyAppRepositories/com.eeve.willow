components:
  parameters:
    emotionName:
      name: emotionName
      in: query
      schema:
        type: string
        enum:
          - HardEmergencyStop
          - EmergencyStop
          - Docked
          - FollowPersons
          - WaitForPersons
          - NoPersonFound
          - SupervisedMappingFailed
          - Docking
          - QrScanning
          - QrScanned
          - WifiConnected
          - WifiFailed
          - BackendConnected
          - UserLinked
          - BatteryEmpty
          - BatteryLow
          - BatteryMedium
          - BatteryHigh
          - BatteryFull
          - RemoteControl
      required: true
      description: The name of the emotion
    mapId:
      name: id
      in: path
      schema:
        type: string
        format: uuid
      required: true
      description: Unique ID of the map to retrieve
    speed:
      name: speed
      in: query
      schema:
        type: number
        format: double
        default: 0.2
      required: false
      description: The robot speed while driving (in meters per second)
    distance:
      name: distance
      in: query
      schema:
        type: number
        format: double
        default: 0.8
      required: false
      description: The travelling distance (in meters)
    turnRadius:
      name: turnRadius
      in: query
      schema:
        type: number
        format: double
        default: 0
      required: false
      description: The turn radius (in meters)
    rotation:
      name: rotation
      in: query
      schema:
        type: number
        format: double
        default: 0
      required: false
      description: The rotation (in degrees)
    powerLimit:
      name: powerLimit
      in: query
      schema:
        type: number
        format: float
        default: 1
      required: false
      description: The fraction of power to use (1.0 corresponds to 100%)
    wheelLock:
      name: wheelLock
      in: query
      schema:
        $ref: '#/components/schemas/WheelLock'
        default: none
      required: false
      description: A mode for controlling any of the wheels to be locked, i.e. not turning, while driving
    maxMowingTime:
      name: maxMowingTime
      in: query
      schema:
        type: integer
        default: 0
      required: false
      description: The maximum duration to mow
    sceneObject:
      name: sceneObject
      in: path
      schema:
        type: string
        enum:
          - toadicharger
          - person
      required: true
      description: The name of the object in the scene
    annotationPartId:
      name: file
      in: query
      schema:
        type: string
      required: true
      description: filename of specific part of the annotation
    annotationId:
      name: id
      in: query
      schema:
        type: string
      required: true
      description: id of the annotation
    recordingFilepath:
      name: path
      in: path
      schema:
        type: string
      required: true
      description: file path of the recording
  responses:
    default500:
      description: The server could not handle the request
    default200:
      description: OK
    invalidMapId:
      description: Not a valid map ID
    badRequestBody:
      description: The request body is ill-formed
    default403:
      description: The operation is forbidden
    default404:
      description: The requested resource was not found
  schemas:
    CurrentActivities:
      type: object
      properties:
        userActivity:
          description: The name of the currently active user activity
          type: string
        scheduledActivity:
          description: The name of the currently active scheduled activity
          type: string
    ConfigHistoryInfo:
      type: object
      properties:
        filename:
          description: The timestamped name of the configuration file
          type: string
        contents:
          description: The contents of the configuration file
          type: object
    ApplicationConfig:
      description: The application configuration
    DiskInfo:
      type: object
      properties:
        capacity:
          description: The total capacity of the maps filesystem in MB
          type: integer
        free:
          description: The free space of the maps filesystem in MB
          type: integer
      example:
        capacity: 13339
        free: 10607
    DirectoryInfo:
      required:
        - id
      properties:
        id:
          description: The absolute name of the directory
          type: string
        name:
          description: The name of the directory
          type: string
        size:
          description: The size of the directory in MB
          type: integer
      example:
        id: /home/toadi/data/maps/MapExplore_0001_20230316-115349
    GeoCoordinate:
      type: array
      items:
        type: number
        format: float
        description: Pairs of longitude, latitude
    Geometry:
      required:
        - coordinates
        - type
      properties:
        coordinates:
          type: array
          items:
            $ref: '#/components/schemas/GeoCoordinate'
        type:
          type: string
          enum:
            - Point
            - Polygon
            - LineString
            - MultiPoint
    FeatureProperties:
      required:
        - description
      properties:
        color:
          type: string
          description: A hexadecimal color value for visualization purposes
        description:
          type: string
        direction:
          type: number
          format: float
          description: The direction the object is facing, i.e. the yaw angle (expressed in radians). 0 radians represents north, pi/4 radians east, pi/2 radians south and -pi/4 radians west
        enabled:
          type: boolean
        fill:
          type: boolean
        objectType:
          type: string
          enum:
            - CHARGINGSTATION
        perimeterType:
          type: string
          enum:
            - GRASSZONE
            - PORTAL
            - INNER
            - OUTER
    Feature:
      required:
        - geometry
        - properties
        - type
      properties:
        geometry:
          $ref: '#/components/schemas/Geometry'
        id:
          type: string
        properties:
          $ref: '#/components/schemas/FeatureProperties'
        type:
          type: string
          enum:
            - Feature
    FeatureCollection:
      properties:
        features:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
        type:
          type: string
          enum:
            - FeatureCollection
    HomogeneousTransformationArray:
      description: A row-major representation of the 16 elements in a homogeneous transformation matrix
      type: array
      items:
        type: number
        format: float
      minItems: 16
      maxItems: 16
    MapInfo:
      required:
        - directory
        - id
      properties:
        directory:
          description: The name of the directory the map is located in
          type: string
        name:
          type: string
        id:
          description: The unique identifier of this map
          type: string
          format: uuid
        transform:
          description: The total of the homogeneous transformations applied to this map
          $ref: '#/components/schemas/HomogeneousTransformationArray'
        featureCollection:
          $ref: '#/components/schemas/FeatureCollection'
    GeoCoordinateObject:
      description: A geo-special coordinate specified by its latitude and longitude
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          format: float
        lng:
          type: number
          format: float
    GeoEuclideanTransformation:
      description: A geo-spatial (i.e. in terms of GPS coordinates) Euclidian transformation
      required:
        - origin
      properties:
        origin:
          $ref: '#/components/schemas/GeoCoordinateObject'
        translation:
          $ref: '#/components/schemas/GeoCoordinateObject'
          default:
            lat: 0
            lng: 0
        rotation:
          description: The angle of rotation about the y-axis placed at the translation point
          type: number
          format: double
          default: 0
        scale:
          description: The scale factor
          type: number
          format: double
          default: 1
    WorldCoordinateXZ:
      type: array
      description: The x- and y- coordinates of a point within the robot's world frame (positive z is north, positive x is east, positive y is up)
      items:
        type: number
        format: float
      minItems: 2
      maxItems: 2
    WorldCoordinate3D:
      type: array
      description: A coordinate within the robot's world frame (positive z is north, positive x is east, positive y is up)
      items:
        type: number
        format: float
      minItems: 3
      maxItems: 3
    EuclideanTransformation:
      description: An Euclidian world transformation
      required:
        - origin
      properties:
        origin:
          $ref: '#/components/schemas/WorldCoordinateXZ'
        translation:
          $ref: '#/components/schemas/WorldCoordinate3D'
          default:
            value:
              - 0
              - 0
              - 0
        rotation:
          description: The angle of rotation about the y-axis placed at the translation point
          type: number
          format: double
          default: 0
        scale:
          description: The scale factor
          type: number
          format: double
          default: 1
    MapType:
      type: string
      enum:
        - Orb
        - Superpoint
    CameraCoordinate:
      required:
        - x
        - 'y'
      properties:
        x:
          type: number
          format: double
          minimum: 0
          maximum: 640
          description: The x-coordinate of the point in the camera image, expressed in pixels.
        'y':
          type: number
          format: double
          minimum: 0
          maximum: 480
          description: The y-coordinate of the point in the camera image, expressed in pixels.
      description: A camera coordinate, expressed in pixels. The top-left corner has coordinate (0,0) and the image frame has a size of 640x480 pixels.
    WheelLock:
      type: string
      enum:
        - none
        - left
        - right
    RecoveryInfo:
      required:
        - recoveryMode
      properties:
        recoveryMode:
          type: string
          enum:
            - 'Off'
            - Minimal
            - WithCamera
    WifiSettings:
      required:
        - ssid
        - password
      properties:
        ssid:
          type: string
        password:
          type: string
        userEmail:
          type: string
    DistanceInfo:
      type: object
      properties:
        distance:
          description: The distance to a scene object in meters
          type: number
          format: double
      example:
        distance: 1.3970121145248413
    GpsOdometryDeprecated:
      properties:
        lat:
          description: The latitude
          type: number
          format: double
        lon:
          description: The longitude
          type: number
          format: double
        acc:
          description: The accuracy of the GPS data (expressed in meters)
          type: number
          format: double
        yaw:
          description: The yaw angle (expressed in degrees). 0 degrees represents north, 90 degrees east, 180 degrees south and -90 degrees west
          type: number
          format: double
      example:
        acc: 1
        lat: 50.97703599999775
        lon: 3.5405639999799075
        yaw: -80.90320822820219
    GpsOdometry:
      properties:
        lat:
          description: The latitude
          type: number
          format: double
        lon:
          description: The longitude
          type: number
          format: double
        acc:
          description: The accuracy of the GPS data (expressed in meters)
          type: number
          format: double
        yaw:
          description: The yaw angle (expressed in radians). 0 radians represents north, pi/4 radians east, pi/2 radians south and -pi/4 radians west
          type: number
          format: double
      example:
        acc: 1
        lat: 50.97703599999775
        lon: 3.5405639999799075
        yaw: -1.412027359008789
    RecordingInfo:
      required:
        - name
      properties:
        name:
          type: string
    GpsData:
      properties:
        accuracy:
          type: number
          format: double
          description: Expressed in meters
        datetime:
          type: string
          format: iso8601
        latitude:
          type: number
          format: double
          description: The latitude geocoordinate
        longitude:
          type: number
          format: double
          description: The longitude geocoordinate
        numSatellites:
          type: integer
        speed:
          type: number
          format: double
          description: Expressed in meters per second
        status:
          type: integer
          enum:
            - 0
            - 1
            - 2
          description: 0 corresponds to no connection, 1 to no data and 2 to valid data
        valid:
          type: boolean
      example:
        accuracy: 8.1035
        datetime: '2022-09-20T13:16:16.000Z'
        latitude: 50.9770208994093
        longitude: 3.5405845681746984
        numSatellites: 11
        speed: 0.041
        status: 2
        valid: true
    BatteryStatus:
      properties:
        percentage:
          type: integer
        percentagePerMowingHour:
          type: number
          format: double
        availableMowingTime:
          type: integer
          description: Expressed in seconds
        chargerState:
          type: integer
          enum:
            - 0
            - 1
          description: An integer representing if the charger is connected
        temperature:
          type: integer
          description: Expressed in degrees Celsius
    BootCount:
      required:
        - bootcount
      properties:
        bootcount:
          type: integer
      example:
        bootcount: 352
    DockingState:
      type: string
      enum:
        - StartDocking
        - FindPositionInMap
        - GotoChargingStationProximity
        - GotoRetryPosition
        - PositionInFrontOfChargingStation
        - ConnectToCharger
        - AutoDocked
        - AutoCharging
        - ManualCharging
        - ExitAndRetry
        - GeneralRetry
        - Idle
        - ManualDocked
        - Unknown
    ChargeStatus:
      type: string
      enum:
        - Thermal regulation active
        - Vin Uvcl active
        - Iin limit active
        - Constant current
        - Constant voltage
        - Charger off
        - Error
    ChargerState:
      type: string
      enum:
        - Battery detect failed fault
        - Battery detection
        - Charger suspended
        - Precharge
        - cc-cv charge
        - Ntc pause
        - Timer terminated
        - c over x terminated
        - Max charge time fault
        - Battery missing fault
        - Battery short fault
        - Unknown
    DockingPosition:
      type: string
      enum:
        - Bad
        - Good
        - Unknown
    DockingInfo:
      properties:
        dockingState:
          $ref: '#/components/schemas/DockingState'
        chargeStatus:
          $ref: '#/components/schemas/ChargeStatus'
        chargerState:
          $ref: '#/components/schemas/ChargerState'
        chargingCurrent:
          type: number
          format: double
          description: Expressed in amperes
        chargingPower:
          type: number
          format: double
          description: Expressed in watts
        dockingPosition:
          $ref: '#/components/schemas/DockingPosition'
        counters:
          description: The number of times the robot has been in a particular docking state ("../components/schemas.yaml#/DockingState")
          type: object
          additionalProperties:
            type: integer
    EmergencyStop:
      properties:
        description:
          type: string
    ExploringInfo:
      properties:
        exploringState:
          type: string
          enum:
            - Idle
            - Mapping
            - GotoZone
            - DockingAndRecording
            - DockingAndReadyToBuildMap
            - DockedAndRecording
            - DockedAndReadyToBuildMap
            - ExploringDone
            - ExploringError
            - ExploringPaused
        lastExploreTime:
          type: string
          format: date-time
    HardwareInfo:
      description: Information on the robot's hardware
      properties:
        hardwareVersion:
          type: string
          format: version-number
        motorDirection:
          type: integer
          enum:
            - 0
            - 1
          description: 0 represents a normal motor direction, 1 an inverted motor direction
        mowerType:
          type: integer
          enum:
            - 0
            - 1
          description: 0 represents the V1 mower, 1 the 70W V2 mower, 2 the BLDC V3 mower
        serialNumber:
          type: string
        uniqueHardwareId:
          type: string
          format: mac
        wheelMotorsType:
          type: integer
          enum:
            - 0
            - 1
            - 2
          description: 0 represents gearbox motors, 1 outrunners
      example:
        hardwareVersion: 3.5.1
        motorDirection: 1
        mowerType: 2
        serialNumber: TOADI000003002
        uniqueHardwareId: 48:b0:2d:3e:20:b1
        wheelMotorsType: 1
    MotorControllerStatus:
      properties:
        errors:
          type: array
          items:
            type: string
        firmwareVersion:
          type: string
          format: version
        hardwareVersion:
          type: string
          format: version
        serialNumber:
          type: string
        type:
          type: string
          enum:
            - ODrive
        uptime:
          type: integer
          description: The uptime of the motor controller (expressed in seconds)
    MowerInfo:
      properties:
        mowerHeight:
          type: number
          format: double
          description: The height of the mower blades (expressed in meters)
        rpm:
          type: integer
          description: The current RPM of the mower blades
    MowingTime:
      required:
        - today
        - total
      properties:
        current:
          type: integer
          description: The time mowed in this mowing session (expressed in minutes)
        max:
          type: integer
          description: The maximum time of a mowing session (expressed in minutes)
        today:
          type: integer
          description: The time mowed today (expressed in minutes)
        total:
          type: integer
          description: The total time mowed (expressed in minutes)
    ZoneMowingInfo:
      required:
        - area
        - id
        - totalRequiredMowingTime
      properties:
        area:
          type: number
          format: double
          description: The area of the zone (expressed in square meters)
        elapsedMowingTime:
          type: integer
          description: The total mowing time in this zone (expressed in seconds)
        elapsedMowingTimeToday:
          type: integer
          description: Today's mowing time in this zone (expressed in seconds)
        id:
          type: string
        totalRequiredMowingTime:
          type: integer
          description: The time it approximately takes to mow this zone (expressed in seconds)
        resumeMowingTime:
          type: string
          format: time
          description: The time when mowing in this zone will resume
        startMowingTime:
          type: string
          format: time
          description: The time that mowing started in this zone
    MowingInfo:
      required:
        - mowingTime
        - zoneIdToMow
        - zonesInfo
      properties:
        mowingTime:
          $ref: '#/components/schemas/MowingTime'
        lastRainTime:
          type: string
          format: time
          description: The last time it was raining
        todayEndTime:
          type: string
          format: time
          description: The time when mowing ends today
        zoneIdToMow:
          type: string
          description: The id of the zone currently being mowed
        zonesInfo:
          type: array
          items:
            $ref: '#/components/schemas/ZoneMowingInfo'
    NetworkInterface:
      type: string
      enum:
        - Unknown
        - Wifi
        - MobileNetwork
        - Ethernet
    ConnectivityState:
      type: string
      enum:
        - Offline
        - Online
        - Pending
        - ConnectedButNotOnline
    DisconnectedReason:
      type: string
      enum:
        - None
        - WrongPassword
    MobileInfo:
      properties:
        state:
          $ref: '#/components/schemas/ConnectivityState'
        reason:
          $ref: '#/components/schemas/DisconnectedReason'
    WifiInfo:
      properties:
        ssid:
          type: string
        localIp:
          type: string
        state:
          $ref: '#/components/schemas/ConnectivityState'
        reason:
          $ref: '#/components/schemas/DisconnectedReason'
    NetworkInfo:
      properties:
        default:
          $ref: '#/components/schemas/NetworkInterface'
        mobile:
          $ref: '#/components/schemas/MobileInfo'
        state:
          $ref: '#/components/schemas/ConnectivityState'
        wifi:
          $ref: '#/components/schemas/WifiInfo'
    PowerManagerStatus:
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - Unknown
            - LowPower
            - ReducedPower
            - FullPower
    TimeInfo:
      required:
        - systemTime
        - timeZone
        - uptime
      properties:
        sunrise:
          type: string
          format: time
        sunset:
          type: string
          format: time
        systemTime:
          type: string
          format: time
        timeZone:
          type: string
        uptime:
          type: integer
          description: The time since last reboot (expressed in seconds)
          example:
            sunrise: '2022-09-19 07:27:06'
            sunset: '2022-09-19 19:51:09'
            systemTime: '2022-09-19 12:18:16'
            timeZone: Europe/Brussels
            uptime: 255777
    VersionInfo:
      properties:
        applicationVersion:
          type: string
        osVersion:
          type: string
        apiVersion:
          type: integer
    WeedingInfo:
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Whether the robot has a working weeding sprayer available
    NetworkStatus:
      properties:
        BSSID:
          type: string
        SSID:
          type: string
        frequency:
          type: integer
        signal:
          type: integer
    Networks:
      properties:
        networks:
          type: array
          items:
            $ref: '#/components/schemas/NetworkStatus'
    BlockingReason:
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the reason that blocks the start of an activity. For example, "inChargingStation" means that the activity cannot be started because the robot is currently in the charging station.
    Schedule:
      properties:
        resume:
          type: string
          format: date-time
    ScheduleInfo:
      properties:
        blockedBy:
          type: array
          items:
            $ref: '#/components/schemas/BlockingReason'
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'
    Tool:
      required:
        - active
        - name
      properties:
        active:
          type: boolean
        auto:
          description: Blocking reasons for automatic scheduling
          $ref: '#/components/schemas/ScheduleInfo'
        manual:
          description: Blocking reasons for manual activation
          $ref: '#/components/schemas/ScheduleInfo'
        name:
          type: string
    ToolPlannerStatus:
      required:
        - tools
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
    ZoneIds:
      type: object
      additionalProperties:
        type: string
      description: An associative array between zone IDs and their names
      example:
        GRASSZONE_556ef0c9-ce24-4237-85a2-e39a5ae00e78: Grass Zone 1
    MapRecordingInfo:
      required:
        - isRecording
      properties:
        isRecording:
          type: boolean
        recordingPath:
          type: string
    AnnotationRecordingInfo:
      required:
        - path
      properties:
        path:
          type: string
        name:
          type: string
        size:
          type: integer
        width:
          type: integer
        height:
          type: integer
        totalFrames:
          type: integer
        thumbnailPath:
          type: string
    MkvPlaybackInfo:
      type: object
      properties:
        numFrames:
          type: integer
        currentFrameNum:
          type: integer
        streamFrameNum:
          type: integer
    LivestreamStartRequest:
      type: object
      required:
        - peerUuid
        - streamType
      properties:
        peerUuid:
          type: string
          description: WebRTC peer UUID from the `/webrtc` signaling session
        streamType:
          type: string
          enum:
            - live
            - recording
        videoFile:
          type: string
          description: Path to MKV file (required for recording playback when opening a specific file)
    LivestreamStopRequest:
      type: object
      required:
        - peerUuid
      properties:
        peerUuid:
          type: string
        streamType:
          type: string
          enum:
            - live
            - recording
          description: Set to `recording` when stopping a file-playback peer
    HiggsTrainRequest:
      type: object
      required:
        - actionName
        - recordingDirs
        - modelName
      properties:
        actionName:
          type: string
        recordingDirs:
          type: array
          items:
            type: string
        modelName:
          type: string
        epochs:
          type: integer
          default: 300
        arm:
          type: array
          items:
            type: string
            enum:
              - left
              - right
