  /webrtc:
    get:
      tags:
        - WebRTC and livestreams
      summary: WebRTC signaling endpoint (WebSocket)
      description: |
        Clients establish a WebRTC session by connecting to this path as a **WebSocket**
        (`ws://<robot-host>:8080/webrtc` on LAN, or via the EEVE cloud relay at
        `wss://app.services.eeve.com/api/robots/{robotId}/webSocket` when using remote access).

        The robot advertises this path via Bonjour (`_toadi._tcp`, TXT `path=/webrtc`).

        ### Connection flow

        1. Open the WebSocket and send `startHttpTunnel` with a unique `peerUuid`.
        2. Receive `sdpOffer` from the robot.
        3. Create an `RTCPeerConnection`, set the remote offer, create an answer, and send `sdpAnswer`.
        4. Optionally handle `iceCandidate` messages from the robot.
        5. Once connected, the robot opens a WebRTC data channel labelled `httpcalls` for tunneled HTTP,
           and may add a video track for live or file-based streaming.
        6. Send `stopHttpTunnel` to tear down the session.

        ### Client → robot messages (JSON)

        | command | fields | purpose |
        |---------|--------|---------|
        | `startHttpTunnel` | `peerUuid`, optional `sessionSettings.videoFile` | Start a WebRTC session. `videoFile` selects file-playback mode for MKV recordings. |
        | `sdpAnswer` | `peerUuid`, `sdpAnswer: { type, sdp }` | Send the local SDP answer after receiving `sdpOffer`. |
        | `stopHttpTunnel` | `peerUuid` | Close the WebRTC peer connection. |

        ### Robot → client messages (JSON)

        | command | fields | purpose |
        |---------|--------|---------|
        | `sdpOffer` | `sdpOffer: { type, sdp }` | Remote SDP offer after `startHttpTunnel`. |
        | `sdpAnswer` | `sdpAnswer: { type, sdp }` | Confirmed SDP after `sdpAnswer` (negotiated codecs/methods). |
        | `iceCandidate` | `candidate` | Trickle ICE candidate from the robot. |
      responses:
        '101':
          description: Switching Protocols (WebSocket upgrade)
        '426':
          description: Upgrade Required (client did not request WebSocket)
  /info:
    get:
      tags:
        - WebRTC and livestreams
      summary: MKV playback state (file tunnel)
      description: |
        Returns playback state for an MKV recording streamed over a **file WebRTC tunnel**
        (second peer connection with `sessionSettings.videoFile` set during `startHttpTunnel`).
        Requests are sent on the file tunnel's `httpcalls` data channel, not the main tunnel.
      responses:
        '200':
          description: Playback info
          content:
