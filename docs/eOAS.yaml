openapi: 3.0.3
info:
  title: Willow APIs
  description: |
    This page contains documentation for the Willow API (application public interface), described by means of HTTP requests.
    As this web page is hosted on the robot's web server, the 'Try it out' buttons can be used to test the APIs directly on the robot itself.

    ## WebRTC connectivity

    The [EEVE mobile app](https://eeve.com) (`eeve-app`) connects to the robot over **WebRTC** for remote and local access:

    1. **Signaling** — WebSocket at `/webrtc` (LAN) or via the EEVE cloud relay.
    2. **Data channel** — After the peer connection is established, REST calls are tunneled over the `httpcalls` protobuf data channel (`DatachannelApi.proto`).
    3. **Video** — Live camera or MKV file playback is started with `POST /api/livestreams/startVideo`.
    4. **File playback controls** — Paths such as `/info`, `/play`, `/pause`, and `/goto` are served on a dedicated file WebRTC tunnel.

    All HTTP endpoints documented below can be called either directly on the robot web server or through the WebRTC data channel tunnel.

    Further questions while developing your custom application? Head to the [EEVE forum](https://forum.eeve.com) for additional help.
  version: 4.1.0
servers:
  - url: /
tags:
  - name: Activities and tools
    description: Information about your robot's activities, and software tools
  - name: Localization
    description: More info on your robot's current location
  - name: Maps
    description: A deeper look inside your robot's internalized maps
  - name: Miscellaneous
  - name: Navigation
    description: Control your robot's navigation
  - name: Recordings
    description: Video recordings and annotation media
  - name: Annotations
    description: Annotation images and corrections
  - name: Settings
    description: Change your robot's system settings
  - name: Status and system information
    description: More information on your robot's status and system information
  - name: WebRTC and livestreams
    description: WebRTC signaling, video streaming, and file playback over WebRTC tunnels
paths:
  /activities/info:
    get:
      deprecated: true
      tags:
        - Activities and tools
      description: Gets information on the robot's current activities
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentActivities'
              examples:
                While mowing:
                  value:
                    scheduledActivity: MowingPlannerActivity
                    userActivity: ''
                Not busy:
                  value:
                    scheduledActivity: ''
                    userActivity: ''
                Manual mode:
                  value:
                    scheduledActivity: ''
                    userActivity: manualdriving
        '500':
          $ref: '#/components/responses/default500'
  /api/activities/info:
    get:
      tags:
        - Activities and tools
      description: Gets information on the robot's current activities
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentActivities'
              examples:
                While mowing:
                  value:
                    scheduledActivity: MowingPlannerActivity
                    userActivity: ''
                Not busy:
                  value:
                    scheduledActivity: ''
                    userActivity: ''
                Manual mode:
                  value:
                    scheduledActivity: ''
                    userActivity: manualdriving
        '500':
          $ref: '#/components/responses/default500'
  /api/calibration/camera/lens/reset:
    put:
      tags:
        - Settings
      description: Resets the calibration of the camera lens. This will reboot the robot application
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '500':
          $ref: '#/components/responses/default500'
  /api/calibration/camera/lens/isCalibrated:
    get:
      tags:
        - Settings
      description: Gets if the calibration of the camera lens has been performed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: boolean
        '500':
          $ref: '#/components/responses/default500'
  /api/configHistory:
    get:
      tags:
        - Miscellaneous
      description: Returns the history of the application config
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: A sorted list of config history entries
                type: array
                items:
                  $ref: '#/components/schemas/ConfigHistoryInfo'
  /api/configuration/application:
    get:
      tags:
        - Settings
      description: Returns the current application config
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: The current application config
                $ref: '#/components/schemas/ApplicationConfig'
    put:
      tags:
        - Settings
      description: Triggers a reconfigure of the application config system
      responses:
        '200':
          $ref: '#/components/responses/default200'
    post:
      tags:
        - Settings
      description: Updates the application config. Requires a reconfigure to take effect.
      requestBody:
        description: The new application config
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationConfig'
      responses:
        '200':
          $ref: '#/components/responses/default200'
  /maintenance/clearRainSensor:
    get:
      deprecated: true
      tags:
        - Miscellaneous
      description: Clears the rain sensor status
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '500':
          $ref: '#/components/responses/default500'
  /api/maintenance/clearRainSensor:
    put:
      tags:
        - Miscellaneous
      description: Clears the rain sensor status
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '500':
          $ref: '#/components/responses/default500'
  /api/maintenance/mapsFilesystem/diskInfo:
    get:
      tags:
        - Miscellaneous
      description: Returns information about the maps filesystem
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskInfo'
  /api/maintenance/mapsFilesystem/listMaps:
    get:
      tags:
        - Miscellaneous
      description: Returns a list of all maps
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectoryInfo'
                example:
                  - id: /home/toadi/data/maps/MapExplore_0001_20230316-115349
                    name: MapExplore_0001_20230316-115349
                    size: 60
  /api/maintenance/mapsFilesystem/listRecordings:
    get:
      tags:
        - Miscellaneous
      description: Returns a list of all recordings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectoryInfo'
                example:
                  - id: /home/toadi/data/recordings/maps/MapExplore_0001_20220920-090835
                    name: MapExplore_0001_20220920-090835
                    size: 276
  /api/maintenance/mapsFilesystem/remove:
    post:
      tags:
        - Miscellaneous
      description: Removes a directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectoryInfo'
              example:
                id: /home/toadi/data/maps/MapExplore_0001_20230316-115349
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '500':
          $ref: '#/components/responses/default500'
  /api/maintenance/mapsFilesystem/toggleDisable:
    put:
      tags:
        - Miscellaneous
      description: Marks a directory as active or inactive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectoryInfo'
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '500':
          $ref: '#/components/responses/default500'
  /maintenance/reboot:
    get:
      deprecated: true
      tags:
        - Miscellaneous
      description: Reboots the robot application
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '500':
          $ref: '#/components/responses/default500'
  /api/maintenance/reboot:
    put:
      tags:
        - Miscellaneous
      description: Reboots the robot application
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '500':
          $ref: '#/components/responses/default500'
  /maintenance/showEmotion:
    get:
      deprecated: true
      tags:
        - Miscellaneous
      description: Shows an emotion on the displays
      parameters:
        - $ref: '#/components/parameters/emotionName'
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '500':
          $ref: '#/components/responses/default500'
  /api/maintenance/shutdown:
    put:
      tags:
        - Miscellaneous
      description: Shuts the robot down
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '500':
          $ref: '#/components/responses/default500'
  /api/maintenance/showEmotion:
    put:
      tags:
        - Miscellaneous
      description: Shows an emotion on the displays
      parameters:
        - $ref: '#/components/parameters/emotionName'
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '500':
          $ref: '#/components/responses/default500'
  /api/mapobjects:
    get:
      tags:
        - Maps
      description: Gets the objects available in the map
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureCollection'
              example:
                features:
                  - geometry:
                      coordinates:
                        - 3.540569
                        - 50.977033
                      type: Point
                    id: CHARGING_STATION_e6257851-5f40-4818-93cf-fa75ae9172d9
                    properties:
                      description: CHARGINGSTATION created by the toadi web interface.
                      enabled: true
                      objectType: CHARGINGSTATION
                    type: Feature
                type: FeatureCollection
        '500':
          $ref: '#/components/responses/default500'
  /api/maps:
    get:
      tags:
        - Maps
      description: Gets the robot's maps
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MapInfo'
        '500':
          $ref: '#/components/responses/default500'
  /api/maps/{id}:
    get:
      description: Gets a map by ID
      tags:
        - Maps
      parameters:
        - $ref: '#/components/parameters/mapId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapInfo'
        '404':
          $ref: '#/components/responses/invalidMapId'
        '500':
          $ref: '#/components/responses/default500'
  /api/maps/{id}/bounds:
    get:
      tags:
        - Maps
      description: Gets the bounds of a map by ID
      parameters:
        - $ref: '#/components/parameters/mapId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Geometry'
        '404':
          $ref: '#/components/responses/invalidMapId'
        '500':
          $ref: '#/components/responses/default500'
  /api/maps/{id}/delete:
    put:
      tags:
        - Maps
      description: Deletes the recording and processed map associated to the map ID
      parameters:
        - $ref: '#/components/parameters/mapId'
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '404':
          $ref: '#/components/responses/invalidMapId'
        '500':
          $ref: '#/components/responses/default500'
  /api/maps/{id}/geopoints:
    get:
      tags:
        - Maps
      description: Gets the map's observed feature points
      parameters:
        - $ref: '#/components/parameters/mapId'
      responses:
        '200':
          description: OK
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/FeatureCollection'
        '404':
          $ref: '#/components/responses/invalidMapId'
        '500':
          $ref: '#/components/responses/default500'
  /api/maps/{id}/name:
    put:
      tags:
        - Maps
      description: Sets the name of the map
      parameters:
        - $ref: '#/components/parameters/mapId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '400':
          $ref: '#/components/responses/badRequestBody'
        '404':
          $ref: '#/components/responses/invalidMapId'
        '500':
          $ref: '#/components/responses/default500'
  /api/maps/{id}/trajectory:
    get:
      tags:
        - Maps
      description: Gets the current trajectory of the robot within the given map
      parameters:
        - $ref: '#/components/parameters/mapId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Geometry'
        '404':
          $ref: '#/components/responses/invalidMapId'
        '500':
          $ref: '#/components/responses/default500'
  /api/maps/{id}/transform:
    put:
      deprecated: true
      tags:
        - Maps
      description: Applies a homogeneous transformation to the map
      parameters:
        - $ref: '#/components/parameters/mapId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/GeoEuclideanTransformation'
                - $ref: '#/components/schemas/EuclideanTransformation'
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '400':
          $ref: '#/components/responses/badRequestBody'
        '500':
          $ref: '#/components/responses/default500'
    post:
      tags:
        - Maps
      description: Applies a homogeneous transformation to the map
      parameters:
        - $ref: '#/components/parameters/mapId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/GeoEuclideanTransformation'
                - $ref: '#/components/schemas/EuclideanTransformation'
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '400':
          $ref: '#/components/responses/badRequestBody'
        '500':
          $ref: '#/components/responses/default500'
  /api/maps/{id}/type:
    get:
      tags:
        - Maps
      description: Gets the type of a map by ID
      parameters:
        - $ref: '#/components/parameters/mapId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapType'
        '404':
          $ref: '#/components/responses/invalidMapId'
        '500':
          $ref: '#/components/responses/default500'
  /api/maps/{id}/firstImage:
    get:
      tags:
        - Maps
      description: Gets the first keyframe preview image of an explore map
      parameters:
        - $ref: '#/components/parameters/mapId'
      responses:
        '200':
          description: OK
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/invalidMapId'
        '500':
          $ref: '#/components/responses/default500'
  /api/maps/{id}/lastImage:
    get:
      tags:
        - Maps
      description: Gets the last keyframe preview image of an explore map
      parameters:
        - $ref: '#/components/parameters/mapId'
      responses:
        '200':
          description: OK
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/invalidMapId'
        '500':
          $ref: '#/components/responses/default500'
  /api/maps/build:
    put:
      tags:
        - Maps
      description: Starts map building. Any current activity will be aborted and the 'learning' sensor alarm will be set
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '500':
          $ref: '#/components/responses/default500'
  /api/maps/autoalign:
    put:
      tags:
        - Maps
      description: Automatically align the maps to each other and to the zones and to their gps signal as a fallback
      parameters:
        - name: force
          in: query
          schema:
            type: boolean
            default: false
          description: If false, any manually transformed maps will not be changed. If true, all maps will be aligned
      responses:
        '200':
          $ref: '#/components/responses/default200'
        '500':
          $ref: '#/components/responses/default500'
  /navigation/autopilot:
    get:
      deprecated: true
      tags:
        - Navigation
      description: Navigate on autopilot
      parameters:
        - $ref: '#/components/parameters/speed'
        - $ref: '#/components/parameters/distance'
        - name: latitude
          in: query
          schema:
            type: number
            format: double
          required: false
          description: The latitude of the point to navigate to
        - name: longitude
          in: query
          schema:
            type: number
            format: double
          required: false
          description: The longitude of the point to navigate to
        - name: goto
          in: query
          schema:
            type: string
            enum:
              - currentMowingZone
              - gotoZone
              - keyFrame
          required: false
          description: A specification for the endpoint of the autopilot navigation
        - name: zone
          in: query
          schema:
            type: string
          required: false
          description: The zone to navigate to, if goto:gotoZone is specified
        - name: object
          in: query
          schema:
            type: string
            enum:
              - person
              - border
          required: false
          description: An object for the robot to follow
        - name: keyFrameId
          in: query
          schema:
            type: integer
          required: false
          description: The ID of the key frame to navigate to, if goto:keyFrame is specified
      responses:
        '200':
          $ref: '#/components/responses/default200'
  /api/navigation/autopilot:
    put:
      tags:
        - Navigation
      description: Navigates on autopilot
      parameters:
        - $ref: '#/components/parameters/speed'
        - $ref: '#/components/parameters/distance'
        - name: latitude
          in: query
          schema:
            type: number
            format: double
          required: false
          description: The latitude of the point to navigate to
        - name: longitude
          in: query
          schema:
            type: number
            format: double
          required: false
          description: The longitude of the point to navigate to
        - name: goto
          in: query
          schema:
            type: string
            enum:
              - currentMowingZone
              - gotoZone
              - keyFrame
          required: false
          description: A specification for the endpoint of the autopilot navigation
        - name: zone
          in: query
          schema:
            type: string
          required: false
          description: The zone to navigate to, if goto:gotoZone is specified
        - name: object
          in: query
          schema:
            type: string
            enum:
              - person
              - border
          required: false
          description: An object for the robot to follow
        - name: keyFrameId
          in: query
          schema:
            type: integer
          required: false
          description: The ID of the key frame to navigate to, if goto:keyFrame is specified
      responses:
        '200':
          $ref: '#/components/responses/default200'
  /api/navigation/auto-camera-lens-calibration:
    put:
      tags:
        - Settings
      description: Starts an automatic calibration of the camera lens. This will reboot the robot application
      responses:
        '200':
          $ref: '#/components/responses/default200'
  /navigation/backwards:
    get:
      deprecated: true
      tags:
        - Navigation
      description: While in [manual driving mode](#/Navigation/put_api_navigation_startmanualdriving), makes the robot navigate backwards
      parameters:
        - $ref: '#/components/parameters/speed'
        - $ref: '#/components/parameters/distance'
        - $ref: '#/components/parameters/turnRadius'
        - $ref: '#/components/parameters/rotation'
        - $ref: '#/components/parameters/powerLimit'
      responses:
        '200':
          $ref: '#/components/responses/default200'
  /api/navigation/backwards:
    put:
      tags:
        - Navigation
      description: While in [manual driving mode](#/Navigation/put_api_navigation_startmanualdriving), makes the robot navigate backwards
      parameters:
        - $ref: '#/components/parameters/speed'
        - $ref: '#/components/parameters/distance'
        - $ref: '#/components/parameters/turnRadius'
        - $ref: '#/components/parameters/rotation'
        - $ref: '#/components/parameters/powerLimit'
      responses:
        '200':
          $ref: '#/components/responses/default200'
  /api/navigation/driveToCameraCoordinate:
    put:
      tags:
        - Navigation
      description: While in [manual driving mode](#/Navigation/put_api_navigation_startmanualdriving), makes the robot navigate to a coordinate in the camera frame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraCoordinate'
            examples:
              To the visual center:
                value:
                  x: 320
                  'y': 240
      parameters:
        - $ref: '#/components/parameters/speed'
      responses:
        '200':
          $ref: '#/components/responses/default200'
